<style>
  body{ min-height:100vh; display:flex; flex-direction:column; }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 0;
    text-align:center;
  }

  .error-shell{
    position:relative;
    max-width:560px;
    margin:0 auto;
    padding:0 32px;
  }

  .error-glow{
    content:'';
    position:absolute;
    top:-120px; left:50%;
    width:420px; height:420px;
    background:radial-gradient(circle, rgba(var(--hot-rgb),0.16), transparent 70%);
    filter:blur(20px);
    transform:translateX(-50%);
    pointer-events:none;
    z-index:-1;
  }

  .error-code{
    position:relative;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(72px, 14vw, 120px);
    line-height:1;
    color:var(--text);
    letter-spacing:-0.02em;
    margin-bottom:8px;
  }
  .error-code span{ color:var(--hot); }

  .error-shell h1{
    font-size:clamp(22px, 3.4vw, 28px);
    color:var(--text);
    margin-bottom:14px;
  }
  .error-shell p{
    color:var(--muted);
    font-size:15.5px;
    line-height:1.6;
    max-width:42ch;
    margin:0 auto 32px;
  }

  .error-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:44px;
  }

  .error-links{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    font-size:13.5px;
    color:var(--muted-2);
  }
  .error-links a{
    color:var(--muted);
    transition:color .15s ease;
  }
  .error-links a:hover, .error-links a:focus-visible{
    color:var(--hot);
    outline:none;
  }
  .error-links .dot{ color:var(--line); }
</style>
</head>
